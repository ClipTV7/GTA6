<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--panel:rgba(12,12,14,.66);--line:rgba(255,255,255,.16);--dim:rgba(255,255,255,.72);--rumor:#FFD400;--fake:#E53935}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff;
  font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
#dim{position:absolute;inset:0;background:#000;opacity:.2}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.80) 0%,rgba(0,0,0,.1) 20%,rgba(0,0,0,.1) 54%,rgba(0,0,0,.80) 74%,rgba(0,0,0,.92) 100%)}
.scene{position:absolute;inset:0;display:none}
.headline{position:absolute;left:50%;top:296px;transform-origin:50% 50%;background:#fff;color:#000;font-weight:900;
  font-size:56px;letter-spacing:-.5px;padding:15px 26px 14px;border-radius:14px;white-space:nowrap;line-height:1;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.panel{position:absolute;left:120px;width:840px;top:430px;background:var(--panel);
  backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);
  border:2px solid var(--line);border-radius:30px;padding:38px 40px 40px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ptitle{font-weight:800;font-size:31px;letter-spacing:5px;color:var(--dim);text-transform:uppercase}
/* reçu : statut + source */
.receipt{position:absolute;left:0;right:0;top:1150px;display:flex;gap:14px;align-items:center;justify-content:center}
.chip{font-weight:900;font-size:25px;padding:10px 15px 9px;border-radius:9px;line-height:1;letter-spacing:1px}
.chip.ok{background:#fff;color:#000}.chip.rumor{background:var(--rumor);color:#000}.chip.fake{background:var(--fake);color:#fff}
.src{font-weight:700;font-size:24px;color:rgba(255,255,255,.8);letter-spacing:.5px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
/* sous-titres */
#caps{position:absolute;left:120px;right:120px;white-space:nowrap;text-wrap:balance;top:1236px;text-align:center;font-weight:900;font-size:84px;line-height:1.08;
  text-transform:uppercase;letter-spacing:-1px}
#caps span{display:inline-block;-webkit-text-stroke:15px #000;paint-order:stroke fill;margin:0 20px;transform-origin:50% 65%}
.small{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:22px;color:rgba(255,255,255,.74);
  text-shadow:0 1px 4px rgba(0,0,0,.95)}
/* jauge */
.meter{position:relative;height:96px;margin:46px 22px 0}
.track{position:absolute;left:0;right:0;top:34px;height:28px;border-radius:14px;background:rgba(255,255,255,.14);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.25),#fff);border-radius:14px}
.tick{position:absolute;top:0;width:3px;height:100%;background:rgba(0,0,0,.35)}
.knob{position:absolute;top:10px;width:76px;height:76px;margin-left:-38px;border-radius:50%;background:#fff;border:9px solid #000;
  box-shadow:0 0 0 4px #fff,0 10px 26px rgba(0,0,0,.6)}
.mlabels{display:flex;justify-content:space-between;margin-top:26px}
.mlab{font-weight:900;font-size:40px;padding:12px 16px 11px;border-radius:12px;color:rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.2)}
.mlab.on{background:#fff;color:#000;border-color:#fff}
.mhint{margin-top:30px;font-weight:800;font-size:36px;color:var(--dim);text-align:center}
/* liste */
.li{display:flex;align-items:center;gap:22px;padding:17px 20px;border-radius:18px;margin-top:14px;background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.08)}
.li .num{flex:none;width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.55);display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:30px}
.li .lt{font-weight:800;font-size:46px;letter-spacing:-.5px}
.li .tag{margin-left:auto;font-weight:900;font-size:22px;letter-spacing:2px;padding:8px 12px;border-radius:8px;background:#000;color:#fff}
.li.on{background:#fff;color:#000}.li.on .num{border-color:#000;background:#000;color:#fff}
.cta{margin:26px auto 0;width:max-content;font-weight:900;font-size:34px;letter-spacing:2px;padding:14px 22px;border-radius:12px;
  background:#fff;color:#000}
/* écran partagé */
.half{position:absolute;left:0;width:1080px;height:960px;overflow:hidden}
.half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.half.top{top:0}.half.bot{top:960px}
.half::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55))}
.hlabel{position:absolute;left:60px;z-index:2;font-weight:900;font-size:64px;letter-spacing:2px;padding:12px 22px 10px;border-radius:14px;
  background:#fff;color:#000}
.half.top .hlabel{bottom:60px}.half.bot .hlabel{top:60px}
.divider{position:absolute;left:0;right:0;top:956px;height:8px;background:#fff}
.swap{position:absolute;left:480px;top:900px;width:120px;height:120px;border-radius:50%;background:#000;border:6px solid #fff;
  display:flex;align-items:center;justify-content:center}
.swap svg{width:64px;height:64px}
/* svg schémas */
.diag{display:block;margin:22px auto 0}
.node{font-weight:900;font-size:40px;letter-spacing:1px;padding:14px 22px 12px;border-radius:14px;background:#fff;color:#000;
  width:max-content;margin:0 auto}
.node.ghost{background:transparent;color:#fff;border:3px solid #fff}
.rtitle{font-weight:900;font-size:92px;letter-spacing:-1px;margin-top:10px}
.rsub{font-weight:800;font-size:40px;color:var(--dim);margin-top:6px}
/* barres */
.brow{display:flex;align-items:center;gap:22px;margin-top:40px}
.blabel{flex:none;width:170px;font-weight:900;font-size:46px}
.btrack{position:relative;flex:1;height:84px;border-radius:16px;background:rgba(255,255,255,.08);overflow:hidden}
.bfill{position:absolute;left:0;top:0;bottom:0;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:flex-end;
  padding-right:18px;color:#000;font-weight:900;font-size:44px}
.bfill.muted{background:rgba(255,255,255,.4)}
.bnote{margin-top:34px;font-weight:800;font-size:32px;color:var(--dim)}
/* grille */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.tile{position:relative;height:168px;border-radius:16px;overflow:hidden;border:3px solid rgba(255,255,255,.12)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.75))}
.tile .tl{position:absolute;left:14px;bottom:10px;z-index:2;font-weight:900;font-size:34px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.tile.on{border-color:#fff}
/* date */
.cal{width:360px;margin:20px auto 0;border-radius:24px;overflow:hidden;background:#fff;color:#000;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.cal .m{background:#000;color:#fff;font-weight:900;font-size:36px;letter-spacing:6px;text-align:center;padding:16px 0 14px;border:4px solid #fff;
  border-bottom:none;border-radius:24px 24px 0 0}
.cal .d{font-weight:900;font-size:190px;line-height:1;text-align:center;padding:16px 0 0;letter-spacing:-6px}
.cal .w{font-weight:900;font-size:32px;letter-spacing:5px;text-align:center;padding:4px 0 22px}
.chips{display:flex;gap:16px;justify-content:center;margin-top:34px}
.pchip{font-weight:900;font-size:36px;padding:14px 22px 12px;border-radius:12px;border:3px solid #fff}
.pchip.on{background:#fff;color:#000}

/* ===== thème NEWS (actu chaude) ===== */
#tagrow{position:absolute;left:60px;top:290px;display:flex;gap:12px;align-items:center;z-index:5}
.tagb{display:flex;align-items:center;gap:12px;background:#E53935;color:#fff;font-weight:900;font-size:34px;letter-spacing:2px;
  padding:12px 18px 11px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tagb .dot{width:16px;height:16px;border-radius:50%;background:#fff}
.tagk{font-weight:900;font-size:30px;letter-spacing:2px;padding:11px 16px 10px;border-radius:10px;border:3px solid #fff;color:#fff;
  background:rgba(0,0,0,.45)}
#prog{position:absolute;left:0;top:0;height:10px;background:#fff;width:0;z-index:6}
.news .headline{left:60px;top:396px;transform-origin:0 50%;font-size:50px}
.slam{position:absolute;left:60px;right:140px;top:420px;font-weight:900;font-size:118px;line-height:1.02;letter-spacing:-3px;text-transform:uppercase}
.slam.low{top:auto;bottom:440px}
.slam span{display:inline-block;margin:0 26px 8px 0;-webkit-text-stroke:16px #000;paint-order:stroke fill;transform-origin:20% 80%}
.slam span.em.on{background:#fff;color:#000;-webkit-text-stroke:0;border-radius:8px;box-shadow:0 0 0 9px #fff}
.card{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.12);margin-top:12px}
.compact .card{padding:11px 18px;margin-top:9px}.compact .card .ct{font-size:36px}
.card .ct{font-weight:800;font-size:42px;letter-spacing:-.5px;line-height:1.1}
.card .cn{flex:none;font-weight:900;font-size:30px;width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center}
.card .st{flex:none;margin-left:auto;font-weight:900;font-size:22px;letter-spacing:1.5px;padding:9px 12px 8px;border-radius:8px}
.st.ok{background:#fff;color:#000}.st.rumor{background:var(--rumor);color:#000}.st.fake{background:var(--fake);color:#fff}
.st.q{background:rgba(255,255,255,.18);color:#fff;min-width:46px;text-align:center}
.card.hl .st.q{background:#000;color:#fff}
.st.fake.stamp{border:4px solid #fff;box-shadow:0 0 0 4px var(--fake),0 10px 30px rgba(0,0,0,.6);transform-origin:50% 50%;font-size:26px}
.card.hl{background:#fff;color:#000;border-color:#fff}.card.hl .st.ok{background:#000;color:#fff}.card.hl .cn{border-color:#000}
.card .ic{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px}
.ic.yes{background:#fff;color:#000}.ic.no{background:var(--fake);color:#fff}
.stat{text-align:center}
.stat .num{font-weight:900;font-size:210px;line-height:.95;letter-spacing:-8px;margin-top:10px}
.stat .lab{font-weight:900;font-size:46px;margin-top:6px}
.stat .sub{font-weight:700;font-size:32px;color:var(--dim);margin-top:10px}
.quote .q{font-weight:900;font-size:58px;line-height:1.12;letter-spacing:-1px;margin-top:18px}
.quote .q b{background:#fff;color:#000;padding:0 10px;border-radius:8px}
.quote .who{font-weight:800;font-size:32px;color:var(--dim);margin-top:24px}
.pchipx{position:absolute;left:60px;top:1080px;font-weight:900;font-size:34px;letter-spacing:2px;padding:12px 18px 11px;border-radius:10px;background:#fff;color:#000}
.bgwrap{position:absolute;inset:0;opacity:0}
.bgwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
</style></head>
<body><div id="stage"></div>
<script>
const D = /*__DATA__*/;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ap=(lt,delay,d=.32)=>eOut((lt-delay)/d);
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function wordAt(sc,key,fb){ // temps local du 1er mot qui commence par key
  if(key){const k=norm(key);for(const w of sc.words){if(norm(w.w).startsWith(k))return w.s-sc.start}}
  return (fb==null?.2:fb)*sc.dur}
function enter(node,lt,sc,delay=0){ // entrée du panneau (déjà visible sur la 1re image du clip)
  const a=sc.index===0?1:ap(lt,delay,.3);node.style.opacity=a;node.style.transform=`translateY(${(1-a)*36}px)`}
const stage=document.getElementById('stage');
const BG=[];D.scenes.forEach((sc,i)=>{(sc.bgs&&sc.bgs.length?sc.bgs:[{src:sc.bg,at:0}]).forEach((g,j,arr)=>{
  const b=el('div','bgwrap',null,stage);const im=el('img',null,null,b);im.src=g.src;
  BG.push({b,im,scene:i,start:sc.start+g.at,end:j+1<arr.length?sc.start+arr[j+1].at:sc.start+sc.dur})})});
const dim=el('div',null,null,stage);dim.id='dim';
const shade=el('div',null,null,stage);shade.id='shade';
const B={};
/* ---------- composants ---------- */
B.meter=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);el('div','ptitle',p.title,panel);
  const m=el('div','meter',null,panel);const tr=el('div','track',null,m);const fill=el('div','fill',null,tr);
  for(let i=1;i<10;i++){el('div','tick',null,tr).style.left=(i*10)+'%'}
  const knob=el('div','knob',null,m);const labs=el('div','mlabels',null,panel);
  const L=el('div','mlab',p.left,labs),R=el('div','mlab',p.right,labs);
  const hint=p.hint?el('div','mhint',p.hint,panel):null;
  const t0=wordAt(sc,p.from_word,.1),t1=wordAt(sc,p.to_word,.7);
  const P0=t0/Math.max(1,Math.round(t0/1.2));return lt=>{enter(panel,lt,sc);const x=lt<t0?.5-.5*Math.cos(2*Math.PI*lt/P0):eInOut((lt-t0)/Math.max(.4,t1-t0));
    knob.style.left=(x*100)+'%';knob.style.transform=`scale(${x<.02?1+.08*Math.sin(lt*9):1})`;fill.style.width=(x*100)+'%';
    L.classList.toggle('on',x<.5);R.classList.toggle('on',x>.97);
    if(hint)hint.style.opacity=ap(lt,t0,.3)}};
B.list=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);el('div','ptitle',p.title,panel);
  const rows=p.items.map((t,i)=>{const r=el('div','li',null,panel);el('div','num',p.letters?String.fromCharCode(65+i):String(i+1),r);
    el('div','lt',t,r);if(p.tags&&p.tags[i])el('div','tag',p.tags[i],r);return r});
  const cta=p.cta?el('div','cta',p.cta,panel):null;
  return lt=>{enter(panel,lt,sc);rows.forEach((r,i)=>{const a=sc.index===0?1:ap(lt,.12+i*.1,.28);r.style.opacity=a;
      r.style.transform=`translateX(${(1-a)*-40}px)`;
      let on;if(p.active==='words'){let cur=-1;(p.item_words||[]).forEach((w,j)=>{if(lt>=wordAt(sc,w,9e9))cur=j});on=cur===i}
      else on=p.active==='cycle'?(Math.floor(Math.max(0,lt-.6)/.55)%rows.length===i):p.active===i;r.classList.toggle('on',on)});
    if(cta){cta.style.opacity=ap(lt,.12,.28);cta.style.transform=`scale(${1+.035*Math.sin(lt*7)})`}}};
B.split=(sc,root)=>{const p=sc.scene;const parts=['top','bottom'].map(k=>{const h=el('div','half '+(k==='top'?'top':'bot'),null,root);
    const im=el('img',null,null,h);im.src=p[k].img;const lab=el('div','hlabel',p[k].label,h);return {h,im,lab,t:wordAt(sc,p[k].word,k==='top'?.1:.3)}});
  el('div','divider',null,root);const sw=el('div','swap',
    '<svg viewBox="0 0 64 64"><path d="M20 8v40M20 8l-10 12M20 8l10 12M44 56V16M44 56l-10-12M44 56l10-12" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',root);
  const tSwitch=wordAt(sc,p.switch_word||'switch',.6);
  return lt=>{// avant "switch" : chaque perso s'allume quand il est nommé ; après : bascule rapide
    let act;if(lt<tSwitch){act=lt>=parts[1].t?1:0}else{act=Math.floor((lt-tSwitch)/.7)%2===0?1:0}
    const ph=lt<tSwitch?0:((lt-tSwitch)%.7)/.7;
    parts.forEach((pt,i)=>{const on=i===act;pt.im.style.filter=`brightness(${on?1:.32}) saturate(${on?1.05:.4})`;
      pt.im.style.transform=`scale(${1.03+.05*(lt/sc.dur)})`;pt.lab.style.opacity=on?1:.45;
      pt.lab.style.transform=`scale(${on?1:.92})`});
    const rot=lt<tSwitch?0:(Math.floor((lt-tSwitch)/.7)*180+eOut(ph*3)*180);sw.style.transform=`rotate(${rot}deg)`}};
B.branch=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);
  el('div','node',p.root,panel);
  const svg=el('div',null,'<svg class="diag" width="760" height="300" viewBox="0 0 760 300">'+
    '<path id="tr" d="M380 0 V110" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>'+
    ['M380 110 C380 190 130 170 130 270','M380 110 V270','M380 110 C380 190 630 170 630 270'].map((d,i)=>
      `<path class="br" d="${d}" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>`).join('')+
    [130,380,630].map(x=>`<circle class="dot" cx="${x}" cy="270" r="20" fill="#fff"/>`).join('')+'</svg>',panel);
  const leaf=el('div','node ghost',p.leaf,panel);leaf.style.marginTop='18px';
  const paths=[...svg.querySelectorAll('path')],dots=[...svg.querySelectorAll('circle')];
  paths.forEach(pa=>{const L=pa.getTotalLength();pa.style.strokeDasharray=L;pa.dataset.L=L});
  const tLeaf=wordAt(sc,p.leaf_word,.6);
  return lt=>{enter(panel,lt,sc);paths.forEach((pa,i)=>{const a=i===0?ap(lt,.25,.35):ap(lt,.55+(i-1)*.12,.5);
      pa.style.strokeDashoffset=pa.dataset.L*(1-a)});
    dots.forEach((d,i)=>{const a=ap(lt,1.0+i*.1,.25);d.setAttribute('r',20*a)});
    const a=ap(lt,tLeaf,.3);leaf.style.opacity=a;leaf.style.transform=`scale(${.9+.1*a})`;
    leaf.style.background=a>.99?'#fff':'transparent';leaf.style.color=a>.99?'#000':'#fff'}};
B.route=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);el('div','ptitle',p.kicker||'',panel);
  el('div','rtitle',p.title,panel);el('div','rsub',p.sub,panel);
  const wrap=el('div',null,'<svg class="diag" width="760" height="330" viewBox="0 0 760 330">'+
    '<path id="rp" d="M70 290 C220 290 200 120 360 150 S560 280 690 50" stroke="rgba(255,255,255,.95)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="2 22"/>'+
    '<circle cx="70" cy="290" r="22" fill="#fff"/><circle cx="690" cy="50" r="26" fill="none" stroke="#fff" stroke-width="8"/>'+
    '<circle cx="690" cy="50" r="9" fill="#fff"/><g id="car"><circle r="30" fill="#fff"/><path d="M-14 6 h28 l-5 -14 h-18z" fill="#000"/><circle cx="-8" cy="9" r="5" fill="#000"/><circle cx="8" cy="9" r="5" fill="#000"/></g>'+
    `<text x="40" y="250" fill="#fff" font-size="30" font-weight="900" text-anchor="start" font-family="Inter Display">${p.from}</text>`+
    `<text x="730" y="118" fill="#fff" font-size="30" font-weight="900" text-anchor="end" font-family="Inter Display">${p.to}</text></svg>`,panel);
  const path=wrap.querySelector('#rp'),car=wrap.querySelector('#car');const L=path.getTotalLength();
  const tGo=wordAt(sc,p.go_word||'fast',.45);
  return lt=>{enter(panel,lt,sc);const a=lt<tGo?.16*clamp((lt-.4)/Math.max(.5,tGo-.4)):.16+.84*eOut((lt-tGo)/.35);const pt=path.getPointAtLength(L*a);
    car.setAttribute('transform',`translate(${pt.x},${pt.y})`)}};
B.bars=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);el('div','ptitle',p.title,panel);
  const max=Math.max(...p.rows.map(r=>r.value));
  const rows=p.rows.map((r,i)=>{const row=el('div','brow',null,panel);el('div','blabel',r.label,row);const tr=el('div','btrack',null,row);
    const f=el('div','bfill'+(i<p.rows.length-1?' muted':''),r.text,tr);return {f,w:r.value/max,t:wordAt(sc,r.word,.15+i*.25)}});
  const note=p.note?el('div','bnote',p.note,panel):null;
  return lt=>{enter(panel,lt,sc);rows.forEach((r,i)=>{const a=eOut((lt-(i===0?.3:r.t))/.7);r.f.style.width=(r.w*100*a)+'%';
      r.f.style.color=a>.6?'#000':'transparent'});if(note)note.style.opacity=ap(lt,rows[rows.length-1].t+.4,.3)}};
B.grid=(sc,root)=>{const p=sc.scene;const panel=el('div','panel',null,root);el('div','ptitle',p.title,panel);
  const g=el('div','grid',null,panel);
  const tiles=p.tiles.map((t,i)=>{const d=el('div','tile',null,g);const im=el('img',null,null,d);im.src=t.img;el('div','tl',t.label,d);
